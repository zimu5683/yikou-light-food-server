name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：Actions 页可直接跑「变异门禁」这类耗时较长的作业。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      # 产品只在 Android / Termux 上跑，Windows 与 macOS 从来不是交付目标（APK 才是）。
      # 原来跑三平台矩阵还有个副作用：matrix 默认 fail-fast，Windows 一挂就把
      # ubuntu / macOS 一起取消 —— 连最接近 Android 的代理环境也拿不到测试信号。
      # 现在只留 ubuntu（POSIX 语义最接近 Termux），并关掉 fail-fast，让两个
      # Python 版本都跑完再收结论。
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check app tests scripts
      - run: python -m compileall -q app tests scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint
      - name: Test frontend bridge cursor/dedupe
        working-directory: frontend
        run: pnpm test
      - name: Mutation anchors stay unique
        working-directory: frontend
        run: pnpm check:anchors
      # 浏览器门禁：真实 headless Chrome + CDP，跑 202 条界面断言。
      # 之前只在本机手动跑（本机无 Chrome 就永远跑不到），这里接进流水线。
      # runner 自带 google-chrome，脚本按 $CHROME → google-chrome → chromium 顺序查找。
      - name: Browser interaction gate (headless Chrome)
        working-directory: frontend
        run: node scripts/browser-interaction-check.mjs

  # 变异门禁：证明上面那 202 条浏览器断言不是空转 —— 往隔离副本注入已知缺陷，
  # 要求指定断言必须变成 FAIL、同时控制组仍 PASS。
  # 每个场景都要重建一次 dist 并完整跑一遍浏览器门禁，耗时明显更长，
  # 所以只在 PR 与手动触发（Actions 页 → Run workflow）时跑，不占用每次 push 的时长。
  # 12 个场景 × （重建 + 一次完整门禁 ≈ 3.5 分钟）≈ 50 分钟，超时给到 120 分钟留余量。
  mutation:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build baseline dist
        working-directory: frontend
        run: pnpm build
      - name: Mutation check (all scenarios)
        working-directory: frontend
        run: node scripts/mutation-check.mjs

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Workspace hygiene (tracked files)
        run: python scripts/check_workspace_hygiene.py
      - name: Workspace hygiene (working tree, including untracked files)
        run: python scripts/check_workspace_hygiene.py --working-tree
      # 说明：原「版本一致性」与「签名工具编译」两步已移除 ——
      # 它们校验的是桌面发布流水线（latest.json 清单、Ed25519 签名、PyInstaller 产物），
      # 本项目已改为网页版专用，那条流水线连同相关脚本一起删掉了。
