name: Release

on:
  # A version tag is the production release trigger.  Manual runs are useful
  # for checking that the packaging toolchain still works and upload an
  # Actions artifact without creating a release.
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/yikou-light-food.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  yikou-light-food.exe" | Set-Content "dist/yikou-light-food.exe.sha256" -Encoding ascii

      - name: Generate differential patch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python -m pip install bsdiff4
          python scripts/generate_patch.py windows

      - name: Create release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "manual-$env:GITHUB_RUN_NUMBER" }
          $previous = git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1
          if ($previous) {
            $changes = git log "$previous..HEAD" --pretty=format:'- %s (%h)'
          } else {
            $changes = git log -5 --pretty=format:'- %s (%h)'
          }
          @("## $tag", "", "$changes") | Set-Content -Path release-notes.md -Encoding utf8

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: yikou-light-food-windows
          path: |
            dist/yikou-light-food.exe
            dist/yikou-light-food.exe.sha256
            dist/*.patch
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: release-notes.md
          files: |
            dist/yikou-light-food.exe
            dist/yikou-light-food.exe.sha256
            dist/*.patch
          fail_on_unmatched_files: true

      # The manifest job embeds the official SHA-256 into latest.json so the
      # updater can still verify downloads when GitHub direct connections are
      # unreachable and only the mirror prefixes respond.  patch-meta.json is
      # optional: a first release has no previous tag to diff against.
      - name: Upload checksum metadata for manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-meta
          path: |
            dist/yikou-light-food.exe.sha256
            dist/patch-meta.json
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'from app import __version__; print(__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build app
        run: bash scripts/build_macos.sh
      - name: Smoke-test application imports on macOS
        run: |
          python3 -c "import app.main, app.gui, app.automation, app.sss, app.updater, app.design_system; print('imports OK on macOS')"
      - name: Verify app bundle structure
        run: |
          APP="dist/yikou-light-food.app"
          BIN="$APP/Contents/MacOS/yikou-light-food"
          test -d "$APP" || { echo "missing .app bundle"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "missing Info.plist"; exit 1; }
          test -x "$BIN" || { echo "main binary missing or not executable"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          echo "Architecture:"
          file "$BIN"
      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/yikou-light-food.app" "yikou-light-food-macos.zip"
          shasum -a 256 "yikou-light-food-macos.zip" > "yikou-light-food-macos.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: yikou-light-food-macos
          path: |
            yikou-light-food-macos.zip
            yikou-light-food-macos.zip.sha256
      - name: Publish macOS app to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yikou-light-food-macos.zip
            yikou-light-food-macos.zip.sha256
          fail_on_unmatched_files: true
      - name: Upload checksum metadata for manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-meta
          path: yikou-light-food-macos.zip.sha256
          if-no-files-found: error

  # ubuntu-22.04 (glibc 2.35) keeps the frozen binary compatible with older
  # distributions than ubuntu-latest would.
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'from app import __version__; print(__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build tarball
        run: bash scripts/build_linux.sh
      - name: Smoke-test application imports on Linux
        run: |
          python3 -c "import app.main, app.gui, app.automation, app.sss, app.updater, app.design_system; print('imports OK on Linux')"
      - name: Verify binary and archive
        run: |
          test -x dist/yikou-light-food
          file dist/yikou-light-food
          ./dist/yikou-light-food --version
          test -s yikou-light-food-linux-x64.tar.gz
          tar -tzf yikou-light-food-linux-x64.tar.gz | grep -x "yikou-light-food"
          sha256sum -c yikou-light-food-linux-x64.tar.gz.sha256
      # Boot the frozen GUI headlessly; a startup crash (e.g. a module the
      # PyInstaller analysis missed) must fail the release before publishing.
      - name: Smoke-test frozen GUI under Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          set +e
          timeout 25 xvfb-run -a ./dist/yikou-light-food > gui-smoke.log 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 124 ]; then
            echo "frozen GUI exited during startup (exit ${CODE})"
            cat gui-smoke.log
            exit 1
          fi
          echo "frozen GUI started successfully"
      - uses: actions/upload-artifact@v7
        with:
          name: yikou-light-food-linux
          path: |
            yikou-light-food-linux-x64.tar.gz
            yikou-light-food-linux-x64.tar.gz.sha256
      # 差分补丁以「解压后的裸二进制」为基线（用户本地持有的就是该文件）。
      # 首个版本没有上一版可对照，脚本会跳过且不写元数据。
      - name: Generate differential patch
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -m pip install bsdiff4
          python3 scripts/generate_patch.py linux
      - name: Publish Linux tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yikou-light-food-linux-x64.tar.gz
            yikou-light-food-linux-x64.tar.gz.sha256
          fail_on_unmatched_files: true
      # 首个版本没有补丁，此处不做严格匹配。
      - name: Publish Linux patch to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.patch
          fail_on_unmatched_files: false
      # 上传前先把元数据归拢到一个平铺目录：upload-artifact 会按多个 path
      # 的公共父目录保留结构，混用仓库根文件与 dist/ 下文件会让 meta 在
      # 清单任务下载后落在 dist/dist/ 下而读不到。
      - name: Stage Linux release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p linux-release-meta
          cp yikou-light-food-linux-x64.tar.gz.sha256 linux-release-meta/
          if [ -f dist/patch-meta-linux.json ]; then
            cp dist/patch-meta-linux.json linux-release-meta/
          fi
      - name: Upload checksum metadata for manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-meta
          path: linux-release-meta
          if-no-files-found: error

  # latest.json needs the Windows checksum/patch metadata, the macOS archive
  # checksum and the Linux archive checksum, so it runs as a job that depends
  # on all three builds instead of polling another workflow with a timeout.
  # It remains the only place that uploads latest.json, so the patches field
  # can never be clobbered by a parallel job publishing an empty manifest.
  publish-manifest:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download Windows checksum metadata
        uses: actions/download-artifact@v7
        with:
          name: windows-release-meta
          path: dist
      - name: Download macOS checksum metadata
        uses: actions/download-artifact@v7
        with:
          name: macos-release-meta
          path: dist
      - name: Download Linux checksum metadata
        uses: actions/download-artifact@v7
        with:
          name: linux-release-meta
          path: dist
      - name: Generate latest.json manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_latest_manifest.py
